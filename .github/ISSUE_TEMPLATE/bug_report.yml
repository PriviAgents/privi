name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issue?** Don't file it here. Use the Security tab → Report a vulnerability."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app\n2. Ask the agent for …\n3. …"
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [priviagents.com, Local (demo mode), Local (live mode)]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone 15, Chrome 140 on macOS…
  - type: markdown
    attributes:
      value: Please don't include order numbers, addresses, wallet addresses or other personal details.
